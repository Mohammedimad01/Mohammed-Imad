    <!-- Apply saved palette / motion preference before first paint -->
    <script>
      try {
        var p = localStorage.getItem("mit:palette");
        if (/^(obsidian|cobalt|sage|paper)$/.test(p)) document.documentElement.dataset.palette = p;
        var m = localStorage.getItem("mit:motion");
        var reduced = m === "on" || (m !== "off" && matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.dataset.motion = reduced ? "reduced" : "full";
      } catch (e) {}
    </script>
