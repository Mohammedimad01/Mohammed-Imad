    <!-- Decide appearance, motion and the intro before first paint -->
    <script>
      try {
        var d = document.documentElement;
        var t = localStorage.getItem("mit:theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.theme = t;
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", t === "dark" ? "#000000" : "#ffffff");
        var m = localStorage.getItem("mit:motion");
        var reduced = m === "on" || (m !== "off" && matchMedia("(prefers-reduced-motion: reduce)").matches);
        d.dataset.motion = reduced ? "reduced" : "full";
        // The intro plays when the site is opened from a link (a new tab, or
        // from LinkedIn, email, etc.), not on refresh or Back/Forward, and
        // never for reduced-motion users.
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        var how = nav ? nav.type : (performance.navigation && performance.navigation.type === 1 ? "reload" : "navigate");
        if (!reduced && how === "navigate") {
          d.dataset.intro = "on";
          d.style.setProperty("--intro-shift", "2300ms");
        }
      } catch (e) {}
    </script>

    <!-- Intro: inline so it paints before the app's CSS and JS -->
    <style>
      .intro { display: none; }
      html[data-intro="on"] { overflow: hidden; }
      html[data-intro="on"] .intro {
        --i-bg: #fff; --i-ink: #1d1d1f; --i-mut: #86868b; --i-line: #e8e8ed; --i-acc: #0071e3;
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: var(--i-bg); color: var(--i-ink); cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity .7s cubic-bezier(.25,1,.5,1), filter .7s cubic-bezier(.25,1,.5,1);
      }
      html[data-theme="dark"][data-intro="on"] .intro { --i-bg: #000; --i-ink: #f5f5f7; --i-mut: #86868b; --i-line: #2c2c2e; --i-acc: #2997ff; }
      .intro.is-out { opacity: 0; filter: blur(8px); pointer-events: none; }
      .intro__box { text-align: center; padding: 0 24px; }
      .intro__name, .intro__role { opacity: 0; animation: introIn 1.1s cubic-bezier(.25,1,.5,1) forwards; }
      .intro__name { font-size: clamp(30px, 5vw, 52px); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; animation-delay: .15s; }
      .intro__role { margin-top: 10px; font-size: clamp(17px, 2vw, 21px); font-weight: 500; letter-spacing: -.02em; color: var(--i-mut); animation-delay: .45s; }
      .intro__bar { position: relative; width: 132px; height: 3px; margin: 34px auto 0; border-radius: 3px; background: var(--i-line); overflow: hidden; opacity: 0; animation: introFade .4s ease .6s forwards; }
      .intro__bar i { position: absolute; inset: 0; border-radius: 3px; background: var(--i-acc); transform-origin: left; transform: scaleX(0); animation: introFill 1.5s cubic-bezier(.65,0,.35,1) .65s forwards; }
      @keyframes introIn { from { opacity: 0; transform: translateY(10px); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes introFade { to { opacity: 1; } }
      @keyframes introFill { to { transform: scaleX(1); } }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro__box">
        <div class="intro__name">Mohammed Imad Thotan</div>
        <div class="intro__role">Business Data Analyst</div>
        <div class="intro__bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var d = document.documentElement, el = document.getElementById("intro");
        if (d.dataset.intro !== "on") { el.remove(); return; }
        var t0 = performance.now(), finished = false;
        function done() {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          // The hero's entrance starts as the intro dissolves.
          d.style.setProperty("--intro-shift", Math.max(0, Math.round(performance.now() - t0) - 200) + "ms");
          el.classList.add("is-out");
          setTimeout(function () { delete d.dataset.intro; el.remove(); }, 720);
          // Later visits to the home page (in-app) shouldn't wait for an intro.
          setTimeout(function () { d.style.removeProperty("--intro-shift"); }, 2600);
          removeEventListener("keydown", done);
        }
        var timer = setTimeout(done, 2300);
        el.addEventListener("click", done);
        addEventListener("keydown", done);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
