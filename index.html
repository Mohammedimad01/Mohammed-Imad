    <!-- Apply saved palette / motion preference, and decide on the intro, before first paint -->
    <script>
      try {
        var d = document.documentElement;
        var p = localStorage.getItem("mit:palette");
        var t = localStorage.getItem("mit:theme");
        // "paper" used to be its own palette; it is now Brass in light mode.
        if (p === "paper") { p = "obsidian"; t = t || "light"; localStorage.setItem("mit:palette", p); localStorage.setItem("mit:theme", t); }
        if (/^(obsidian|cobalt|sage)$/.test(p)) d.dataset.palette = p;
        if (t === "light" || t === "dark") d.dataset.theme = t;
        var m = localStorage.getItem("mit:motion");
        var reduced = m === "on" || (m !== "off" && matchMedia("(prefers-reduced-motion: reduce)").matches);
        d.dataset.motion = reduced ? "reduced" : "full";
        // Intro plays on a visitor's first visit only, never for reduced-motion users.
        if (!reduced && !localStorage.getItem("mit:intro")) {
          localStorage.setItem("mit:intro", "1");
          d.dataset.intro = "on";
          d.style.setProperty("--intro-shift", "5000ms");
        }
      } catch (e) {}
    </script>

    <!-- Intro screen styles: inline so they paint before the app's CSS/JS -->
    <style>
      .intro { display: none; }
      html[data-intro="on"] { overflow: hidden; }
      html[data-intro="on"] .intro {
        --i-bg: var(--bg, #070b14); --i-ink: var(--ink, #e6ebf5); --i-mut: var(--ink-3, #7d8ba6);
        --i-acc: var(--accent, #6f9cff); --i-line: var(--line, #1c2740); --i-ok: var(--ok, #7cc49a);
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden;
        background: var(--i-bg); color: var(--i-ink); cursor: pointer;
        transition: transform .8s cubic-bezier(.7,0,.2,1), border-radius .8s cubic-bezier(.7,0,.2,1);
      }
      .intro.is-out { transform: translateY(-100%); border-radius: 0 0 50% 50% / 0 0 8% 8%; }
      .intro__grid { position: absolute; inset: 0; opacity: .5;
        background-image: linear-gradient(var(--i-line) 1px, transparent 1px), linear-gradient(90deg, var(--i-line) 1px, transparent 1px);
        background-size: 56px 56px; mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%); }
      .intro__box { position: relative; width: min(640px, calc(100vw - 40px)); font: 13px/1.7 "JetBrains Mono", ui-monospace, Consolas, monospace; }
      .intro__top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; color: var(--i-mut); }
      .intro__mono { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--i-acc); border-radius: 50%; color: var(--i-acc);
        font: italic 500 15px/1 "Cormorant Garamond", Georgia, serif; }
      .intro__cmd { color: var(--i-ink); white-space: pre-wrap; min-height: 1.7em; }
      .intro__cmd b { color: var(--i-acc); font-weight: 400; }
      .intro__caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -2px; background: var(--i-acc); animation: introBlink 1s steps(1) infinite; }
      .intro__checks { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 30px; color: var(--i-mut); }
      .intro__checks span { opacity: 0; animation: introIn .3s ease forwards; animation-delay: calc(var(--n) * 110ms + 950ms); }
      .intro__checks span::before { content: "\2713  "; color: var(--i-ok); }
      .intro__hello { overflow: hidden; font: 300 clamp(40px, 7.5vw, 84px)/1 "Cormorant Garamond", Georgia, serif; letter-spacing: -.02em; }
      .intro__hello span { display: inline-block; transform: translateY(110%); animation: introUp .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--n) * 90ms + 1250ms); }
      .intro__hello em { color: var(--i-acc); }
      .intro__sub { margin-top: 14px; color: var(--i-mut); opacity: 0; animation: introIn .5s ease 1.7s forwards; }
      .intro__bar { position: relative; height: 2px; margin-top: 30px; background: var(--i-line); overflow: hidden; }
      .intro__bar i { position: absolute; inset: 0; background: var(--i-acc); transform-origin: left; transform: scaleX(0); animation: introFill 4.7s cubic-bezier(.6,.1,.3,1) forwards; }
      .intro__meta { display: flex; justify-content: space-between; margin-top: 10px; color: var(--i-mut); font-size: 11px; }
      @keyframes introUp { to { transform: none; } }
      @keyframes introIn { to { opacity: 1; } }
      @keyframes introFill { to { transform: scaleX(1); } }
      @keyframes introBlink { 50% { opacity: 0; } }
    </style>

  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro__grid"></div>
      <div class="intro__box">
        <div class="intro__top"><span class="intro__mono">MI</span><span>mohammed-imad ~ portfolio</span></div>
        <div class="intro__cmd"><span id="intro-cmd"></span><span class="intro__caret"></span></div>
        <div class="intro__checks"><span style="--n:0">sql</span><span style="--n:1">python</span><span style="--n:2">power-bi</span><span style="--n:3">tableau</span><span style="--n:4">react</span></div>
        <div class="intro__hello"><span style="--n:0">Welcome</span> <span style="--n:1">to</span> <span style="--n:2">my</span> <span style="--n:3"><em>portfolio.</em></span></div>
        <p class="intro__sub">Mohammed Imad Thotan · Data Analyst &amp; Developer · Dubai</p>
        <div class="intro__bar"><i></i></div>
        <div class="intro__meta"><span id="intro-pct">loading 0%</span><span>click or press any key to skip</span></div>
      </div>
    </div>
    <script>
      (function () {
        var d = document.documentElement, el = document.getElementById("intro");
        if (d.dataset.intro !== "on") { el.remove(); return; }
        var t0 = performance.now(), cmd = document.getElementById("intro-cmd"), pct = document.getElementById("intro-pct");
        var text = '$ query --select "Mohammed Imad Thotan" --from portfolio', i = 0;
        var type = setInterval(function () {
          i += 2;
          cmd.innerHTML = text.slice(0, i).replace(/^\$/, "<b>$</b>");
          if (i >= text.length) clearInterval(type);
        }, 26);
        var count = setInterval(function () {
          var p = Math.min(100, Math.round(((performance.now() - t0) / 4700) * 100));
          pct.textContent = (p < 100 ? "loading " : "ready ") + p + "%";
          if (p >= 100) clearInterval(count);
        }, 50);
        var finished = false;
        function done() {
          if (finished) return;
          finished = true;
          clearInterval(type); clearInterval(count); clearTimeout(timer);
          // Hero entrance animations start as the curtain lifts.
          d.style.setProperty("--intro-shift", Math.round(performance.now() - t0) + "ms");
          el.classList.add("is-out");
          setTimeout(function () { delete d.dataset.intro; el.remove(); }, 820);
          removeEventListener("keydown", done);
        }
        var timer = setTimeout(done, 5000);
        el.addEventListener("click", done);
        addEventListener("keydown", done);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
